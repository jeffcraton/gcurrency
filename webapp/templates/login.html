<!DOCTYPE html>
<html>
<head>
    <title>Login - Currency Tracker</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; height: 100vh; }
        .login-form { width: 340px; margin: 50px auto; }
        .login-form form { margin-bottom: 15px; background: #fff; box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3); padding: 30px; }
        .login-form h2 { margin: 0 0 15px; }
    </style>
</head>
<body>
<div class="login-form">
    <form action="/login" method="post">
        <h2 class="text-center">Currency Tracker</h2>       
        <div class="form-group">
            <input type="text" name="token" class="form-control" placeholder="Enter Demo Token (any string)" required="required">
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </div>
        <p class="text-center text-muted small">This is a demo project.</p>
    </form>
</div>
</body>
</html>
